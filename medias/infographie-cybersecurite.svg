<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" role="img" aria-labelledby="t d"><title id="t">Infographie : se protéger sur Internet</title><desc id="d">Trois colonnes : les menaces (virus, ver, cheval de Troie, ransomware, spyware), les risques du quotidien (hameçonnage, arnaques, vol de compte, fuite de données) et les bons réflexes (mots de passe, 2FA, mises à jour, prudence).</desc><rect width="900" height="445" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#14213d"/></marker></defs><style>text{font:14px sans-serif;fill:#14213d;text-anchor:middle}.b{fill:#fff;stroke:#1f5f8b;stroke-width:2}.l{fill:none;stroke:#14213d;stroke-width:1.6;marker-end:url(#a)}.s{font-size:12px;fill:#44506b}</style><text x="450" y="45" style="font:700 26px Georgia,serif">Se protéger sur Internet</text><rect x="15" y="75" width="280" height="40" fill="#1f5f8b" rx="4"/><text x="155" y="101" style="fill:#fff;font-weight:700;font-size:16px">Menaces</text><rect x="15" y="115" width="280" height="236" fill="#f3f5f0" stroke="#cfd6c8"/><circle cx="35" cy="145" r="6" fill="#ffd23f" stroke="#14213d"/><text x="51" y="150" style="text-anchor:start;font-size:13px">Virus : s'attache à un fichier</text><circle cx="35" cy="189" r="6" fill="#ffd23f" stroke="#14213d"/><text x="51" y="194" style="text-anchor:start;font-size:13px">Ver : se propage seul par le réseau</text><circle cx="35" cy="233" r="6" fill="#ffd23f" stroke="#14213d"/><text x="51" y="238" style="text-anchor:start;font-size:13px">Cheval de Troie : faux logiciel utile</text><circle cx="35" cy="277" r="6" fill="#ffd23f" stroke="#14213d"/><text x="51" y="282" style="text-anchor:start;font-size:13px">Ransomware : fichiers chiffrés, rançon</text><circle cx="35" cy="321" r="6" fill="#ffd23f" stroke="#14213d"/><text x="51" y="326" style="text-anchor:start;font-size:13px">Spyware : espionne en silence</text><rect x="310" y="75" width="280" height="40" fill="#1f5f8b" rx="4"/><text x="450" y="101" style="fill:#fff;font-weight:700;font-size:16px">Risques du quotidien</text><rect x="310" y="115" width="280" height="192" fill="#f3f5f0" stroke="#cfd6c8"/><circle cx="330" cy="145" r="6" fill="#ffd23f" stroke="#14213d"/><text x="346" y="150" style="text-anchor:start;font-size:13px">Hameçonnage : faux messages</text><circle cx="330" cy="189" r="6" fill="#ffd23f" stroke="#14213d"/><text x="346" y="194" style="text-anchor:start;font-size:13px">Arnaques : faux support, faux gains</text><circle cx="330" cy="233" r="6" fill="#ffd23f" stroke="#14213d"/><text x="346" y="238" style="text-anchor:start;font-size:13px">Vol de compte : mot de passe réutilisé</text><circle cx="330" cy="277" r="6" fill="#ffd23f" stroke="#14213d"/><text x="346" y="282" style="text-anchor:start;font-size:13px">Fuite de données : service piraté</text><rect x="605" y="75" width="280" height="40" fill="#1f5f8b" rx="4"/><text x="745" y="101" style="fill:#fff;font-weight:700;font-size:16px">Bons réflexes</text><rect x="605" y="115" width="280" height="280" fill="#f3f5f0" stroke="#cfd6c8"/><circle cx="625" cy="145" r="6" fill="#ffd23f" stroke="#14213d"/><text x="641" y="150" style="text-anchor:start;font-size:13px">Mot de passe long et unique</text><circle cx="625" cy="189" r="6" fill="#ffd23f" stroke="#14213d"/><text x="641" y="194" style="text-anchor:start;font-size:13px">Gestionnaire de mots de passe</text><circle cx="625" cy="233" r="6" fill="#ffd23f" stroke="#14213d"/><text x="641" y="238" style="text-anchor:start;font-size:13px">Double authentification (2FA)</text><circle cx="625" cy="277" r="6" fill="#ffd23f" stroke="#14213d"/><text x="641" y="282" style="text-anchor:start;font-size:13px">Mises à jour + antivirus</text><circle cx="625" cy="321" r="6" fill="#ffd23f" stroke="#14213d"/><text x="641" y="326" style="text-anchor:start;font-size:13px">Ne pas cliquer sur un lien douteux</text><circle cx="625" cy="365" r="6" fill="#ffd23f" stroke="#14213d"/><text x="641" y="370" style="text-anchor:start;font-size:13px">Prudence sur le Wi-Fi public</text><text x="450" y="425" class="s">Sources : ANSSI (cyber.gouv.fr) · Cybermalveillance.gouv.fr</text></svg>