<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" role="img" aria-labelledby="t d"><title id="t">Organigramme : recherche du maximum</title><desc id="d">Début, m prend t[0] et i vaut 1. Tant que i &lt; n : si t[i] &gt; m alors m prend t[i] ; puis i augmente de 1. Sinon on renvoie m et c'est la fin.</desc><rect width="540" height="560" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#14213d"/></marker></defs><style>text{font:14px sans-serif;fill:#14213d;text-anchor:middle}.b{fill:#fff;stroke:#1f5f8b;stroke-width:2}.l{fill:none;stroke:#14213d;stroke-width:1.6;marker-end:url(#a)}.s{font-size:12px;fill:#44506b}</style><rect class="b" x="145" y="14" width="90" height="32" rx="16" style="fill:#ffd23f"/><text x="190" y="35" class="">Début</text><rect class="b" x="115.0" y="75" width="150" height="40" rx="3"/><text x="190" y="100" class="">m ← t[0] ; i ← 1</text><polygon class="b" points="190,147 262,185 190,223 118,185"/><text x="190" y="190" class="">i &lt; n ?</text><polygon class="b" points="190,262 262,300 190,338 118,300"/><text x="190" y="305" class="">t[i] &gt; m ?</text><rect class="b" x="125.0" y="385" width="130" height="40" rx="3"/><text x="190" y="410" class="">m ← t[i]</text><rect class="b" x="125.0" y="470" width="130" height="40" rx="3"/><text x="190" y="495" class="">i ← i + 1</text><rect class="b" x="360.0" y="165" width="120" height="40" rx="3"/><text x="420" y="190" class="">renvoyer m</text><rect class="b" x="375" y="249" width="90" height="32" rx="16" style="fill:#ffd23f"/><text x="420" y="270" class="">Fin</text><path class="l" d="M190,50 L190,75"/><path class="l" d="M190,115 L190,147"/><path class="l" d="M190,223 L190,262"/><text x="205" y="245" class="s">oui</text><path class="l" d="M262,185 L360,185"/><text x="310" y="177" class="s">non</text><path class="l" d="M420,205 L420,249"/><path class="l" d="M190,338 L190,385"/><text x="205" y="365" class="s">oui</text><path class="l" d="M190,425 L190,470"/><path class="l" d="M262,300 L340,300 L340,490 L255,490"/><text x="300" y="292" class="s">non</text><path class="l" d="M125,490 L60,490 L60,185 L118,185"/></svg>