<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">Carte mentale : sécurité sur Internet</title><desc id="d">Au centre la sécurité sur Internet, reliée à six branches : menaces, risques, mots de passe, double authentification, mises à jour et vigilance.</desc><rect width="900" height="600" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#14213d"/></marker></defs><style>text{font:14px sans-serif;fill:#14213d;text-anchor:middle}.b{fill:#fff;stroke:#1f5f8b;stroke-width:2}.l{fill:none;stroke:#14213d;stroke-width:1.6;marker-end:url(#a)}.s{font-size:12px;fill:#44506b}</style><line x1="450" y1="300" x2="450" y2="105" stroke="#1f5f8b" stroke-width="2"/><rect x="388" y="87" width="124" height="36" rx="18" fill="#1f5f8b"/><text x="450" y="110" style="fill:#fff;font-weight:700">Menaces</text><text x="450" y="51" class="s" style="fill:#14213d">virus, ver, cheval de Troie</text><text x="450" y="69" class="s" style="fill:#14213d">ransomware, spyware</text><line x1="450" y1="300" x2="710" y2="202" stroke="#1f5f8b" stroke-width="2"/><rect x="648" y="184" width="124" height="36" rx="18" fill="#1f5f8b"/><text x="710" y="208" style="fill:#fff;font-weight:700">Risques</text><text x="710" y="148" class="s" style="fill:#14213d">hameçonnage, arnaques</text><text x="710" y="166" class="s" style="fill:#14213d">vol de compte, fuite de données</text><line x1="450" y1="300" x2="710" y2="398" stroke="#1f5f8b" stroke-width="2"/><rect x="648" y="380" width="124" height="36" rx="18" fill="#1f5f8b"/><text x="710" y="402" style="fill:#fff;font-weight:700">Mots de passe</text><text x="710" y="438" class="s" style="fill:#14213d">longs et uniques</text><text x="710" y="456" class="s" style="fill:#14213d">gestionnaire</text><line x1="450" y1="300" x2="450" y2="495" stroke="#1f5f8b" stroke-width="2"/><rect x="388" y="477" width="124" height="36" rx="18" fill="#1f5f8b"/><text x="450" y="500" style="fill:#fff;font-weight:700">Double auth.</text><text x="450" y="535" class="s" style="fill:#14213d">2e preuve d'identité</text><text x="450" y="553" class="s" style="fill:#14213d">(2FA)</text><line x1="450" y1="300" x2="190" y2="398" stroke="#1f5f8b" stroke-width="2"/><rect x="128" y="380" width="124" height="36" rx="18" fill="#1f5f8b"/><text x="190" y="402" style="fill:#fff;font-weight:700">Mises à jour</text><text x="190" y="438" class="s" style="fill:#14213d">corrigent les failles</text><text x="190" y="456" class="s" style="fill:#14213d">antivirus à jour</text><line x1="450" y1="300" x2="190" y2="202" stroke="#1f5f8b" stroke-width="2"/><rect x="128" y="184" width="124" height="36" rx="18" fill="#1f5f8b"/><text x="190" y="207" style="fill:#fff;font-weight:700">Vigilance</text><text x="190" y="148" class="s" style="fill:#14213d">liens et pièces jointes</text><text x="190" y="166" class="s" style="fill:#14213d">Wi-Fi public</text><ellipse cx="450" cy="300" rx="95" ry="42" fill="#ffd23f" stroke="#14213d" stroke-width="2"/><text x="450" y="297" class="">Sécurité sur</text><text x="450" y="316" class="">Internet</text></svg>