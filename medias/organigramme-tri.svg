<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 700" role="img" aria-labelledby="t d"><title id="t">Organigramme : tri à bulles</title><desc id="d">Deux boucles imbriquées. i va de 0 à n-2, j va de 0 à n-2-i. Si t[j] > t[j+1] on échange les deux éléments. Quand j a fini, i augmente. Quand i a fini, le tableau est trié.</desc><rect width="580" height="700" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#14213d"/></marker></defs><style>text{font:14px sans-serif;fill:#14213d;text-anchor:middle}.b{fill:#fff;stroke:#1f5f8b;stroke-width:2}.l{fill:none;stroke:#14213d;stroke-width:1.6;marker-end:url(#a)}.s{font-size:12px;fill:#44506b}</style><rect class="b" x="195" y="14" width="90" height="32" rx="16" style="fill:#ffd23f"/><text x="240" y="35" class="">Début</text><rect class="b" x="185.0" y="70" width="110" height="40" rx="3"/><text x="240" y="95" class="">i ← 0</text><polygon class="b" points="240,137 312,175 240,213 168,175"/><text x="240" y="180" class="">i ≤ n−2 ?</text><rect class="b" x="35" y="159" width="90" height="32" rx="16" style="fill:#ffd23f"/><text x="80" y="180" class="">Fin</text><rect class="b" x="185.0" y="245" width="110" height="40" rx="3"/><text x="240" y="270" class="">j ← 0</text><polygon class="b" points="240,312 312,350 240,388 168,350"/><text x="240" y="355" class="">j ≤ n−2−i ?</text><rect class="b" x="370.0" y="330" width="120" height="40" rx="3"/><text x="430" y="355" class="">i ← i + 1</text><polygon class="b" points="240,417 312,455 240,493 168,455"/><text x="240" y="460" class="">t[j] &gt; t[j+1] ?</text><rect class="b" x="145.0" y="530" width="190" height="40" rx="3"/><text x="240" y="555" class="">échanger t[j], t[j+1]</text><rect class="b" x="180.0" y="615" width="120" height="40" rx="3"/><text x="240" y="640" class="">j ← j + 1</text><path class="l" d="M240,46 L240,70"/><path class="l" d="M240,110 L240,137"/><path class="l" d="M168,175 L127,175"/><text x="148" y="167" class="s">non</text><path class="l" d="M240,213 L240,245"/><text x="255" y="230" class="s">oui</text><path class="l" d="M240,285 L240,312"/><path class="l" d="M240,388 L240,417"/><text x="255" y="405" class="s">oui</text><path class="l" d="M312,350 L370,350"/><text x="341" y="342" class="s">non</text><path class="l" d="M430,330 L430,175 L312,175"/><path class="l" d="M240,493 L240,530"/><text x="255" y="515" class="s">oui</text><path class="l" d="M312,455 L350,455 L350,635 L300,635"/><text x="335" y="447" class="s">non</text><path class="l" d="M240,570 L240,615"/><path class="l" d="M180,635 L110,635 L110,350 L168,350"/></svg>